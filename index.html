<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול למבדק אמצע כיתה ד׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<meta name="theme-color" content="#fbf8f0">
<style>
:root{--paper:#fbf8f0;--grid:#e1e8f3;--ink:#1b2b5e;--ink2:#56628a;--line:#c5cfe3;--red:#c23b2e;--hl:#ffe27a;--ok:#2d7a4b;--okbg:#eaf4ed;--bad:#b3342a;--badbg:#fcebe8}
*{box-sizing:border-box}
body{margin:0;font-family:Assistant,"Segoe UI",Arial,sans-serif;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-size:18px;line-height:1.5;text-align:right}
#app{position:relative;min-height:100vh;max-width:860px;margin:0 auto;padding:22px 30px 70px 14px}
#app::before{content:"";position:absolute;top:0;bottom:0;right:12px;width:2px;background:rgba(194,59,46,.45)}
h1,h2,.qn,.grade b,.stars,.tn{font-family:"Secular One",Assistant,Arial,sans-serif;font-weight:400}
h1{font-size:36px;line-height:1.15;margin:2px 0 6px}
h2{font-size:23px;margin:0 0 8px}
.hero{background:#fff;border:1.5px solid var(--ink);outline:1.5px solid var(--ink);outline-offset:4px;padding:16px 22px 18px;margin:8px 4px 30px}
.kicker{font-size:15px;font-weight:700;color:var(--red);letter-spacing:.3px}
.hero p{margin:0;color:var(--ink2)}
.count{display:inline-block;margin-top:10px;font-weight:800;color:var(--red)}
.btn{font-family:inherit;font-size:18px;font-weight:700;border:2px solid var(--ink);border-radius:6px;padding:10px 22px;background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 3px 0 #0d1736;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0d1736}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.light{background:var(--paper);color:var(--ink);border-color:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.big{font-size:20px;padding:12px 28px}
.btn:disabled{opacity:.5;cursor:default}
.link{font-family:inherit;font-size:16px;font-weight:700;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:4px 0}
.lvl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 4px 20px}
.lvl .lbl2{font-weight:800}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff}
.seg button{font-family:inherit;font-size:16px;font-weight:700;border:0;background:#fff;color:var(--ink);padding:8px 18px;cursor:pointer}
.seg button+button{border-right:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.lvl .hint{color:var(--ink2);font-size:15px}
.mix{background:var(--ink);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:0 4px 16px;border-radius:4px}
.mix h2{margin:0 0 2px;color:#fff}
.tip{margin:0 4px 28px;font-size:16px;color:var(--ink2)}
.tip b{color:var(--red)}
.topic{margin:0 4px 30px}
.topic header{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.topic h2{margin:0;display:flex;align-items:center;gap:10px}
.tn{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid var(--tc);border-radius:50%;color:var(--tc);font-size:19px;background:#fff}
.mk{background:linear-gradient(transparent 58%,var(--tcl) 58%);padding:0 4px}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.subbtn{font-family:inherit;text-align:right;background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:11px 14px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;transition:background .1s}
.subbtn:hover{background:#fff6cf}
.subbtn .st{display:flex;flex-direction:column;gap:1px}
.subbtn b{font-size:18px;line-height:1.3}
.subbtn small{color:var(--ink2);font-size:14px}
.best{flex:none;display:grid;place-items:center;width:46px;height:46px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-family:"Secular One",Assistant,sans-serif;font-size:15px;transform:rotate(-6deg)}
.best::after{content:"%";font-size:11px;margin-right:1px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;display:flex;gap:2px;height:10px}
.prog i{flex:1;background:var(--line);border-radius:1px}
.prog i.on{background:var(--ink)}
.prog i.cur{background:var(--red)}
.top .cnt{color:var(--ink2);font-size:15px;font-weight:700}
.top .back{background:none;border:0;color:var(--ink);font-family:inherit;font-size:16px;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:22px 24px;margin:0 4px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:var(--ink2);font-weight:700;font-size:16px}
.qn{display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 6px;border:2px solid var(--ink);border-radius:50%;color:var(--ink);font-size:20px}
.qtext{font-size:22px;font-weight:600;margin:6px 0 18px;line-height:1.55}
.figwrap{text-align:center;margin-bottom:10px}
.fig{max-width:100%;height:auto;max-height:230px;direction:ltr}
.fig text{font-family:Assistant,Arial,sans-serif;fill:var(--ink)}
.lbl{font-size:17px;font-weight:700}
.eq{display:inline-block;direction:ltr;unicode-bidi:isolate;font-weight:800;font-size:1.15em;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;direction:ltr;font-weight:800}
.fr .n{border-bottom:2px solid currentColor;padding:0 5px}
.fr .d{padding:0 5px}
.mx{display:inline-flex;align-items:center;gap:2px;direction:ltr;vertical-align:middle}
.mx>b{font-size:1.15em}
.sd{font-weight:800;letter-spacing:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{font-family:inherit;font-size:20px;font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:14px 10px;cursor:pointer;color:var(--ink);min-height:62px;box-shadow:0 3px 0 var(--line)}
.opt:hover:not(:disabled){background:#fff6cf}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.numrow input{font-family:inherit;font-size:26px;font-weight:800;width:200px;padding:6px 10px;border:0;border-bottom:3px solid var(--ink);border-radius:0;background:transparent;text-align:center;direction:ltr;color:var(--ink)}
.numrow input:focus{outline:none;background:#fff6cf}
.numrow input.right{border-color:var(--ok);background:var(--okbg)}
.numrow input.wrong{border-color:var(--bad);background:var(--badbg)}
.unit{color:var(--ink2);font-weight:700;padding-bottom:8px}
.fb{margin-top:18px;border-radius:4px;padding:14px 18px;background:#fff;animation:fade .25s}
.fb.ok{border:1.5px solid var(--ok);background:var(--okbg)}
.fb.bad{border:1.5px solid var(--bad);background:var(--badbg)}
.fb h3{margin:0 0 6px;font-size:21px;display:flex;gap:8px;align-items:baseline}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb h3 .mark{font-size:24px}
.fb mark{background:var(--hl);color:var(--ink);padding:0 6px}
.fb .why{color:#1d2438;font-size:17px;line-height:1.9}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nextrow{margin-top:14px;text-align:left}
.result{text-align:center}
.result h1{margin-bottom:4px}
.stars{font-size:44px;letter-spacing:6px;color:var(--red);line-height:1.2;margin:4px 0}
.stars span{color:var(--line)}
.grade{display:inline-grid;place-items:center;align-content:center;width:132px;height:132px;border:3.5px solid var(--red);border-radius:50%;color:var(--red);transform:rotate(-5deg);margin:10px 0 6px}
.grade b{font-size:52px;line-height:1}
.grade small{font-size:15px;font-weight:700}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.wronglist{text-align:right;margin-top:22px}
.wronglist .w{border-top:1.5px dashed var(--line);padding:12px 0;font-size:17px}
.pv{border-collapse:collapse;margin:0 auto 6px}.pv th{font-size:13px;color:var(--ink2);padding:5px 6px;border:1.5px solid var(--ink);background:#eef2fa;min-width:54px;font-weight:700}
.pv td{font-size:28px;font-weight:800;text-align:center;border:1.5px solid var(--ink);height:52px;min-width:54px;background:#fff}
.pv .sep{border-left:4px solid var(--red)}.pv .hl{background:var(--hl)}
.vert{display:inline-block;font-size:32px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;margin:4px auto}
.vert .op{display:inline-block;width:1.3em;text-align:left;color:var(--red)}.vert .ln{border-top:3px solid var(--ink);margin-top:4px}.vert .qm{color:var(--red)}
details.me{margin:0 4px 30px;background:#fff;border:1.5px solid var(--ink);border-radius:4px}
.me summary{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px;cursor:pointer;list-style:none;font-family:"Secular One",Assistant,sans-serif;font-size:21px}
.me summary::-webkit-details-marker{display:none}
.me summary::after{content:"פתיחה ▾";font-family:Assistant,sans-serif;font-size:14px;font-weight:700;color:var(--ink2);margin-right:auto}
.me[open] summary::after{content:"סגירה ▴"}
.me summary .mk{background:linear-gradient(transparent 58%,#f3cfc9 58%)}
.me summary .sum{font-family:Assistant,sans-serif;font-size:15px;color:var(--ink2);font-weight:600}
.me>*:not(summary){margin-right:18px;margin-left:18px}
.me>.stats{margin-top:4px}.me>*:last-child{margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1.5px dashed var(--line);padding-top:14px}
.stats div{text-align:center}.stats b{display:block;font-family:"Secular One",Assistant,sans-serif;font-weight:400;font-size:30px;line-height:1.1;color:var(--red)}.stats small{color:var(--ink2);font-size:14px;font-weight:700}
.fbtext{margin:14px 0 10px;line-height:1.7}
.prows{display:flex;flex-direction:column;margin-top:14px}
.prow{font-family:inherit;display:grid;grid-template-columns:minmax(120px,1.6fr) 1fr 44px 96px;gap:10px;align-items:center;text-align:right;background:none;border:0;border-top:1.5px dashed var(--line);padding:9px 2px;cursor:pointer;color:var(--ink);font-size:16px}
.prow:hover{background:#fff6cf}
.pbar{height:10px;background:var(--line);border-radius:1px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ink)}
.prow.strong .pbar i{background:var(--ok)}.prow.weak .pbar i{background:var(--red)}
.pp{font-weight:800;text-align:center}.ps{font-size:14px;font-weight:700;color:var(--ink2)}
.prow.strong .ps{color:var(--ok)}.prow.weak .ps{color:var(--red)}
.me h3{margin:18px 18px 6px;font-size:18px}
.plog>div{display:grid;grid-template-columns:52px 1fr auto;gap:10px;border-top:1.5px dashed var(--line);padding:7px 2px;font-size:16px}
.plog span:first-child{color:var(--ink2);font-weight:700}
.pnote{margin:16px 18px 0;font-size:14px;color:var(--ink2)}.pnote .link{font-size:14px}
.resume{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:#fff6cf;border:1.5px solid var(--ink);border-radius:4px;padding:14px 18px;margin:0 4px 18px}
.resume .ra{display:flex;gap:14px;align-items:center}
.share{margin-top:18px;padding:12px 14px;border:1.5px dashed var(--ink);border-radius:4px;background:var(--paper)}
.share p{margin:4px 0 10px;font-size:15px;color:var(--ink2)}.share small{display:block;margin-top:8px;color:var(--ink2);font-size:13px}
.sharerow{display:flex;gap:10px;flex-wrap:wrap}.sharerow input{flex:1;min-width:160px;font-family:inherit;font-size:14px;direction:ltr;text-align:left;padding:8px 10px;border:1.5px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.livebox{margin:0 4px 18px;padding:12px 16px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink2);font-weight:700}
.livebox.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.dot{display:inline-block;width:10px;height:10px;margin-left:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr);row-gap:12px}.prow{grid-template-columns:1fr 70px 40px;row-gap:2px}.prow .pn{grid-column:1/-1}.prow .ps{grid-column:1/-1;margin-top:-2px}}
@media(max-width:520px){#app{padding:14px 22px 60px 8px}#app::before{right:8px}h1{font-size:29px}.qtext{font-size:20px}.card{padding:16px}.hero{padding:14px 16px 16px}.subs{grid-template-columns:1fr}.pv th{font-size:11px;min-width:40px;padding:4px 2px}.pv td{font-size:22px;min-width:40px;height:44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
/* ===================== כלי עזר ===================== */
let LV=1; /* 1 = כמו בחוברת (ברירת מחדל), 2 = אתגר: מעט קשה יותר */
const QN=20; /* שאלות בכל תרגול */
const QM=40; /* שאלות במבדק דמה */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number(n).toLocaleString('en-US');
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><b>${w}</b>${fr(n,d)}</span>`;
const eq=s=>`<span class="eq">${s}</span>`;
const SM='ס״מ', SMR='סמ״ר', NIS='ש״ח';
const GIRLS=['דנה','מיה','נועה','יעל','תמר','שירה'], BOYS=['איתי','נועם','עומר','יונתן','גיא','אורי'];
const person=()=>{const f=Math.random()<.5;return {n:pick(f?GIRLS:BOYS),f}};
const PLACE=['מקום היחידות','מקום העשרות','מקום המאות','מקום האלפים','מקום עשרות האלפים','מקום מאות האלפים','מקום המיליונים'];

const PNAMES=['יחידות','עשרות','מאות','אלפים','עשרות אלפים','מאות אלפים','מיליונים'];
function pvTable(len,rows,hl){
  let h='<div style="overflow-x:auto"><table class="pv" dir="ltr"><tr>';
  for(let i=0;i<len;i++){const p=len-1-i;h+=`<th class="${p===3?'sep':''}${i===hl?' hl':''}">${PNAMES[p]}</th>`}
  h+='</tr>';
  rows.forEach(r=>{h+='<tr>';for(let i=0;i<len;i++){const p=len-1-i;h+=`<td class="${p===3?'sep':''}${i===hl?' hl':''}">${r[i]}</td>`}h+='</tr>'});
  return h+'</table></div>';
}
function vert(a,op,b){return `<div class="vert" dir="ltr"><div>${fmt(a)}</div><div><span class="op">${op}</span>${fmt(b)}</div><div class="ln"></div><div class="qm">?</div></div>`}
function num(q,answer,explain,o={}){return {type:'num',q,answer,explain,unit:o.unit||'',svg:o.svg||''}}
function mc(q,correct,distractors,explain,o={}){
  const seen=new Set([correct]);const ds=[];
  for(const d of distractors){if(!seen.has(d)){seen.add(d);ds.push(d)}}
  let opts=[{h:correct,ok:true},...ds.slice(0,o.fixed?9:3).map(h=>({h,ok:false}))];
  if(!o.fixed)opts=shuffle(opts);
  return {type:'mc',q,options:opts,explain,svg:o.svg||''}
}

/* ===================== מבנה עשרוני ===================== */
function qDigitValue(){
  const len=LV===1?5:R(5,6);const digs=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,len);
  const N=Number(digs.join(''));const idx=R(0,len-1);const p=len-1-idx;const d=digs[idx];const val=d*10**p;
  const ds=[val*10,p>0?val/10:val*100,d,val*100,val/100>=1?val/100:val*1000,digs[(idx+1)%len]*10**p].filter(x=>x!==val);
  return mc(`מהו ערך הספרה <b>${d}</b> במספר ${eq(fmt(N))} ?`,fmt(val),ds.map(fmt),
   `הספרה ${d} נמצאת ב${PLACE[p]}, לכן ערכה הוא ${eq(fmt(val))}.`,{svg:pvTable(len,[digs],idx)});
}
function qAddUnits(){
  const U=[['עשרות',10],['מאות',100],['אלפים',1000],['עשרות אלפים',10000]];
  const [name,u]=pick(U);const k=R(2,9);const N=R(10000,LV===1?99999:899999);const add=Math.random()<.6;
  if(!add&&N-k*u<=0)return qAddUnits();
  const ans=add?N+k*u:N-k*u;
  if(LV===1&&ans>99999)return qAddUnits(); /* החוברת: עד 100,000 */
  return num(add?`מוסיפים ${k} ${name} למספר ${eq(fmt(N))}. איזה מספר מתקבל?`:`מחסירים ${k} ${name} מהמספר ${eq(fmt(N))}. איזה מספר מתקבל?`,ans,
   `${k} ${name} הם ${eq(fmt(k*u))}.<br>${eq(`${fmt(N)} ${add?'+':'−'} ${fmt(k*u)} = ${fmt(ans)}`)}<br>בטבלה רואים: הספרה ב${PLACE[String(u).length-1]} ${add?'גדלה':'קטנה'} ב-${k}.`,{svg:pvTable(String(N).length,[String(N).split('')],String(N).length-String(u).length)});
}
function qWriteNumber(){
  const len=LV===1?5:R(5,6);const ds=[];
  for(let i=0;i<len;i++){ds.push(i===0?R(2,9):(Math.random()<.3?0:R(2,9)))}
  const names=PNAMES;
  const parts=[];let n=0;
  ds.forEach((d,i)=>{const p=len-1-i;n+=d*10**p;if(d>0)parts.push(`${d} ${names[p]}`)});
  const txt=parts.length>1?parts.slice(0,-1).join(', ')+' ו-'+parts[parts.length-1]:parts[0];
  const zeros=ds.some((d,i)=>d===0);
  return num(`כתבו במספרים: <b>${txt}</b>`,n,
   `כותבים כל ספרה במקומה${zeros?', ובמקום שאין בו כלום כותבים 0':''}: ${eq(fmt(n))}`,{svg:pvTable(len,[ds.map(d=>d>0?d:'')],-1)});
}
function qCompareBig(){
  const len=LV===1?5:R(5,6);let a=[R(1,9)];for(let i=1;i<len;i++)a.push(R(0,9));
  const pos=R(1,len-1);let b=a.slice();let nd;do{nd=R(0,9)}while(nd===a[pos]);b[pos]=nd;
  const A=Number(a.join('')),B=Number(b.join(''));const big=Math.max(A,B),small=Math.min(A,B);
  return mc(`איזה מספר גדול יותר?`,fmt(big),[fmt(small)],
   `משווים ספרה אחר ספרה, מהספרה השמאלית ביותר. ההבדל הראשון הוא ב${PLACE[len-1-pos]}: ${a[pos]} מול ${b[pos]}. לכן ${eq(fmt(big))} גדול יותר.`,{fixed:false,svg:pvTable(len,[a,b],-1)});
}
function lineSvg(A,B,k){
  const x0=50,x1=550,y=78,st=(x1-x0)/10;
  let s=`<svg viewBox="0 0 600 140" class="fig"><line x1="20" y1="${y}" x2="580" y2="${y}" stroke="#334" stroke-width="3"/>`;
  for(let i=0;i<=10;i++){const x=x0+i*st,h=i%5===0?15:9;s+=`<line x1="${x}" y1="${y-h}" x2="${x}" y2="${y+h}" stroke="#334" stroke-width="2.5"/>`}
  s+=`<text x="${x0}" y="${y+40}" text-anchor="middle" font-size="19" font-weight="700">${fmt(A)}</text><text x="${x1}" y="${y+40}" text-anchor="middle" font-size="19" font-weight="700">${fmt(B)}</text>`;
  const x=x0+k*st;

  const cp=app.querySelector('[data-copy]');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(cp.dataset.copy)}catch(e){const i=app.querySelector('.sharerow input');i.select();try{document.execCommand('copy')}catch(_){}}cp.textContent='הועתק ✓'};
  const si=app.querySelector('.sharerow input');if(si)si.onclick=()=>si.select();
  const rs=app.querySelector('[data-resume]');if(rs)rs.onclick=resume;
  const dc=app.querySelector('[data-discard]');if(dc)dc.onclick=()=>{clearRun();home()};
  const rz=app.querySelector('[data-reset]');if(rz)rz.onclick=()=>{if(confirm('למחוק את כל ההתקדמות והשיאים?')){ST={a:{},log:[],days:{}};BEST={};try{localStorage.removeItem(SK);localStorage.removeItem(KEY);localStorage.removeItem(RK)}catch(e){}cloudPush(true);home()}};
  app.querySelector('[data-mock]').onclick=()=>{
    const fs=mockGens();start('מבדק דמה',fs,fs.length,'mock',true)};
  window.scrollTo(0,0);
}
function build(gens,n,exact){
  const qs=[];const seen=new Set();const order=exact?gens:[];
  if(!exact){let pool=[];while(pool.length<n)pool=pool.concat(shuffle(gens));pool.slice(0,n).forEach(f=>order.push(f))}
  order.forEach(f=>{let q,tries=0;do{q=f();tries++}while(seen.has(q.q+q.svg)&&tries<8);seen.add(q.q+q.svg);qs.push(q)});
  return qs;
}
function start(title,gens,n,id,exact){S={title,gens,id,qs:build(gens,n,exact),i:0,score:0,wrong:[],done:false,exact:!!exact};show()}
function show(){
  const q=S.qs[S.i],n=S.qs.length;S.done=false;saveRun();ONHOME=false;LIVE={title:S.title,i:S.i,n,score:S.score};cloudPush();
  app.innerHTML=`<div class="top"><button class="back" id="exit">→ חזרה לתפריט</button><div class="prog" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k<S.i?'on':k===S.i?'cur':''}"></i>`).join('')}</div><span class="cnt">${S.i+1} מתוך ${n}</span></div>
  <div class="card"><div class="qhead"><span class="qn">${S.i+1}</span><span>${S.title}</span></div>${q.svg?`<div class="figwrap">${q.svg}</div>`:''}<div class="qtext">${q.q}</div>
  <div id="ans">${q.type==='num'?`<div class="numrow"><input id="in" type="text" inputmode="numeric" autocomplete="off" aria-label="התשובה שלכם" placeholder="התשובה"><span class="unit">${q.unit}</span><button class="btn" id="chk">בדיקה</button></div>`
   :`<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.h}</button>`).join('')}</div>`}</div><div id="fb"></div></div>`;
  document.getElementById('exit').onclick=home;
  if(q.type==='num'){const inp=document.getElementById('in');inp.focus({preventScroll:true});
    const go=()=>{const raw=inp.value.replace(/[,\s]/g,'');if(raw===''||isNaN(Number(raw))){inp.focus();return}answer(Number(raw)===q.answer,String(Number(raw)))};
    document.getElementById('chk').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'&&!S.done){e.preventDefault();go()}}}
  else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);answer(q.options[i].ok,i)});
  window.scrollTo(0,0);
}
function answer(ok,val){
  if(S.done)return;S.done=true;const q=S.qs[S.i];
  if(ok)S.score++;else S.wrong.push(q);
  if(!S.retry)rec(q.sub,ok);
  saveRun(true);LIVE={title:S.title,i:S.i,n:S.qs.length,score:S.score};cloudPush();
  let corr;
  if(q.type==='num'){const inp=document.getElementById('in');inp.disabled=true;inp.classList.add(ok?'right':'wrong');document.getElementById('chk').disabled=true;corr=`<span class="eq">${fmt(q.answer)}</span> ${q.unit}`}
  else{document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.options[i].ok)b.classList.add('right');else if(i===val)b.classList.add('wrong')});corr=q.options.find(o=>o.ok).h}
  const last=S.i===S.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?`<span class="mark">✓</span>${pick(['כל הכבוד!','נכון מאוד!','מעולה!','יפה מאוד!'])}`:`<span class="mark">✗</span>כמעט. התשובה הנכונה: <mark>${corr}</mark>`}</h3><div class="why">${q.explain}</div></div><div class="nextrow"><button class="btn big" id="nx">${last?'לסיום':'השאלה הבאה ←'}</button></div>`;
  const nx=document.getElementById('nx');nx.focus({preventScroll:true});nx.onclick=next;
  nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){if(S.i<S.qs.length-1){S.i++;show()}else finish()}
function finish(){
  const n=S.qs.length,p=Math.round(S.score/n*100);const stars=p>=90?3:p>=70?2:p>=50?1:0;
  if(S.id&&!S.retry)saveBest(S.id+(LV===2?'_h':''),p);
  if(!S.retry)logSession();
  clearRun();ONHOME=false;LIVE=null;cloudPush(true);
  const msg=p>=90?'מדהים! אתם מוכנים למבדק':p>=70?'עבודה טובה! עוד קצת תרגול והכול יושב':p>=50?'התחלה טובה. כדאי לחזור על ההסברים ולנסות שוב':'לא נורא, כל תרגול מקדם. נסו שוב אחרי שתקראו את ההסברים';
  app.innerHTML=`<div class="card result"><h1>סיימתם!</h1><div class="stars" aria-label="${stars} כוכבים מתוך 3">${'★'.repeat(stars)}<span>${'★'.repeat(3-stars)}</span></div><div class="grade"><b>${S.score}</b><small>מתוך ${n}</small></div><p>${msg}</p>
  <div class="actions">${S.wrong.length?`<button class="btn big" id="rw">לתרגל שוב את הטעויות (${S.wrong.length})</button>`:''}<button class="btn big alt" id="again">סבב חדש</button><button class="btn big alt" id="hm">לתפריט</button></div>
  ${S.wrong.length?`<div class="wronglist"><h2>שאלות שכדאי לחזור עליהן</h2>${S.wrong.map(q=>`<div class="w">${q.svg?`<div class="figwrap" style="transform:scale(.8);margin:-10px 0">${q.svg}</div>`:''}<div>${q.q}</div><div style="color:var(--muted);margin-top:4px">${q.explain}</div></div>`).join('')}</div>`:''}</div>`;
  const rw=document.getElementById('rw');if(rw)rw.onclick=()=>{const w=S.wrong;S={...S,qs:w,i:0,score:0,wrong:[],retry:true};show()};
  document.getElementById('again').onclick=()=>{const f=S.exact?mockGens():S.gens;start(S.title,f,S.exact?f.length:QN,S.id,S.exact)};
  document.getElementById('hm').onclick=home;window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S&&S.done){const nx=document.getElementById('nx');if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}});
if(PARENT)parentStart();else{home();cloudSync();document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudPush(true)})}
}
</script>
