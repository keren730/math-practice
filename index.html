<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול למבדק אמצע כיתה ד׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--muted:#5d6b8a;--bg:#f3f6ff;--card:#fff;--line:#dfe6f7;--ok:#2b9348;--okbg:#e6f7ec;--bad:#d9480f;--badbg:#fff0e6;--main:#4263eb}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,Arial,sans-serif;background:linear-gradient(180deg,#eef2ff,#f8fbff 40%);color:var(--ink);font-size:18px;line-height:1.5;text-align:right}
#app{max-width:860px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:30px;margin:6px 0 4px;font-weight:800}
h2{font-size:22px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.hero{background:linear-gradient(135deg,#4263eb,#7048e8);color:#fff;border-radius:22px;padding:20px 22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(66,99,235,.25)}
.hero p{margin:4px 0 0;opacity:.95}
.count{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 14px;margin-top:10px;font-weight:700}
.btn{font-family:inherit;font-size:18px;font-weight:700;border:0;border-radius:14px;padding:12px 22px;background:var(--main);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:#fff;color:var(--main);border:2px solid var(--main);box-shadow:none}
.btn.big{font-size:20px;padding:14px 26px}
.btn:disabled{opacity:.5;cursor:default}
.topic{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;border-top:6px solid var(--tc)}
.topic header{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.topic h2{margin:0}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.subbtn{font-family:inherit;text-align:right;background:#f7f9ff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.subbtn:hover{border-color:var(--tc);background:#fff}
.subbtn b{font-size:18px}
.subbtn small{color:var(--muted);font-size:14px}
.subbtn .best{font-size:14px;color:var(--ok);font-weight:700;min-height:20px}
.mix{background:linear-gradient(135deg,#f59f00,#f76707);border-radius:20px;padding:16px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.mix .btn{background:#fff;color:#d9480f}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.prog{flex:1;min-width:120px;height:12px;background:#dfe6f7;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .3s}
.top .back{background:none;border:0;color:var(--main);font-family:inherit;font-size:16px;cursor:pointer;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 6px 18px rgba(31,42,68,.06)}
.qtext{font-size:22px;font-weight:500;margin:6px 0 16px}
.figwrap{text-align:center;margin-bottom:8px}
.fig{max-width:100%;height:auto;max-height:230px;direction:ltr}
.fig text{font-family:Heebo,Arial,sans-serif;fill:#1f2a44}
.lbl{font-size:17px;font-weight:700}
.eq{display:inline-block;direction:ltr;unicode-bidi:isolate;font-weight:700;font-size:1.15em;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;direction:ltr;font-weight:700}
.fr .n{border-bottom:2px solid currentColor;padding:0 5px}
.fr .d{padding:0 5px}
.mx{display:inline-flex;align-items:center;gap:2px;direction:ltr;vertical-align:middle}
.mx>b{font-size:1.15em}
.sd{font-weight:800;letter-spacing:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{font-family:inherit;font-size:20px;font-weight:700;background:#f7f9ff;border:2px solid var(--line);border-radius:14px;padding:14px 10px;cursor:pointer;color:var(--ink);min-height:62px}
.opt:hover:not(:disabled){border-color:var(--main);background:#fff}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.numrow input{font-family:inherit;font-size:24px;font-weight:700;width:190px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;text-align:center;direction:ltr;color:var(--ink)}
.numrow input:focus{outline:none;border-color:var(--main)}
.numrow input.right{border-color:var(--ok);background:var(--okbg)}
.numrow input.wrong{border-color:var(--bad);background:var(--badbg)}
.unit{color:var(--muted);font-weight:700}
.fb{margin-top:16px;border-radius:16px;padding:14px 18px}
.fb.ok{background:var(--okbg);border:2px solid var(--ok);animation:pop .3s}
.fb.bad{background:var(--badbg);border:2px solid var(--bad);animation:pop .3s}
.fb h3{margin:0 0 6px;font-size:21px}
.fb .why{color:#333;font-size:17px;line-height:1.9}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.nextrow{margin-top:14px;text-align:left}
.result{text-align:center}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.score{font-size:40px;font-weight:800;color:var(--main)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.wronglist{text-align:right;margin-top:18px}
.wronglist .w{border-top:1px dashed var(--line);padding:10px 0;font-size:17px}
.lvl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.lvl .btn{padding:8px 16px;font-size:16px}
.pv{border-collapse:collapse;margin:0 auto 6px}.pv th{font-size:13px;color:var(--muted);padding:5px 6px;border:2px solid var(--line);background:#f1f4ff;min-width:54px;font-weight:700}
.pv td{font-size:28px;font-weight:800;text-align:center;border:2px solid var(--line);height:52px;min-width:54px;background:#fff}
.pv .sep{border-left:4px solid #7048e8}.pv .hl{background:#fff3bf}
.vert{display:inline-block;font-size:32px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;margin:4px auto}
.vert .op{display:inline-block;width:1.3em;text-align:left;color:var(--main)}.vert .ln{border-top:3px solid var(--ink);margin-top:4px}.vert .qm{color:#e8590c}
@media(max-width:520px){.pv th{font-size:11px;min-width:40px;padding:4px 2px}.pv td{font-size:22px;min-width:40px;height:44px}}
.tip{background:#fff9db;border:1px solid #ffe066;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:16px}
@media(max-width:520px){h1{font-size:25px}.qtext{font-size:20px}.card{padding:16px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== כלי עזר ===================== */
let LV=1; /* 1 = קל, 2 = רגיל */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number(n).toLocaleString('en-US');
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><b>${w}</b>${fr(n,d)}</span>`;
const eq=s=>`<span class="eq">${s}</span>`;
const SM='ס״מ', SMR='סמ״ר', NIS='ש״ח';
const GIRLS=['דנה','מיה','נועה','יעל','תמר','שירה'], BOYS=['איתי','נועם','עומר','יונתן','גיא','אורי'];
const person=()=>{const f=Math.random()<.5;return {n:pick(f?GIRLS:BOYS),f}};
const PLACE=['מקום היחידות','מקום העשרות','מקום המאות','מקום האלפים','מקום עשרות האלפים','מקום מאות האלפים','מקום המיליונים'];

const PNAMES=['יחידות','עשרות','מאות','אלפים','עשרות אלפים','מאות אלפים','מיליונים'];
function pvTable(len,rows,hl){
  let h='<div style="overflow-x:auto"><table class="pv" dir="ltr"><tr>';
  for(let i=0;i<len;i++){const p=len-1-i;h+=`<th class="${p===3?'sep':''}${i===hl?' hl':''}">${PNAMES[p]}</th>`}
  h+='</tr>';
  rows.forEach(r=>{h+='<tr>';for(let i=0;i<len;i++){const p=len-1-i;h+=`<td class="${p===3?'sep':''}${i===hl?' hl':''}">${r[i]}</td>`}h+='</tr>'});
  return h+'</table></div>';
}
function vert(a,op,b){return `<div class="vert" dir="ltr"><div>${fmt(a)}</div><div><span class="op">${op}</span>${fmt(b)}</div><div class="ln"></div><div class="qm">?</div></div>`}
function num(q,answer,explain,o={}){return {type:'num',q,answer,explain,unit:o.unit||'',svg:o.svg||''}}
function mc(q,correct,distractors,explain,o={}){
  const seen=new Set([correct]);const ds=[];
  for(const d of distractors){if(!seen.has(d)){seen.add(d);ds.push(d)}}
  let opts=[{h:correct,ok:true},...ds.slice(0,o.fixed?9:3).map(h=>({h,ok:false}))];
  if(!o.fixed)opts=shuffle(opts);
  return {type:'mc',q,options:opts,explain,svg:o.svg||''}
}

/* ===================== מבנה עשרוני ===================== */
function qDigitValue(){
  const len=LV===1?5:R(5,7);const digs=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,len);
  const N=Number(digs.join(''));const idx=R(0,len-1);const p=len-1-idx;const d=digs[idx];const val=d*10**p;
  const ds=[val*10,p>0?val/10:val*100,d,val*100,val/100>=1?val/100:val*1000,digs[(idx+1)%len]*10**p].filter(x=>x!==val);
  return mc(`מהו ערך הספרה <b>${d}</b> במספר ${eq(fmt(N))} ?`,fmt(val),ds.map(fmt),
   `הספרה ${d} נמצאת ב${PLACE[p]}, לכן ערכה הוא ${eq(fmt(val))}.`,{svg:pvTable(len,[digs],idx)});
}
function qAddUnits(){
  const U=[['עשרות',10],['מאות',100],['אלפים',1000],['עשרות אלפים',10000]];
  const [name,u]=pick(U);const k=R(2,9);const N=R(10000,LV===1?99999:899999);const add=Math.random()<.6;
  if(!add&&N-k*u<=0)return qAddUnits();
  const ans=add?N+k*u:N-k*u;
  if(LV===1&&ans>99999)return qAddUnits(); /* החוברת: עד 100,000 */
  return num(add?`מוסיפים ${k} ${name} למספר ${eq(fmt(N))}. איזה מספר מתקבל?`:`מחסירים ${k} ${name} מהמספר ${eq(fmt(N))}. איזה מספר מתקבל?`,ans,
   `${k} ${name} הם ${eq(fmt(k*u))}.<br>${eq(`${fmt(N)} ${add?'+':'−'} ${fmt(k*u)} = ${fmt(ans)}`)}<br>בטבלה רואים: הספרה ב${PLACE[String(u).length-1]} ${add?'גדלה':'קטנה'} ב-${k}.`,{svg:pvTable(String(N).length,[String(N).split('')],String(N).length-String(u).length)});
}
function qWriteNumber(){
  const len=LV===1?5:R(5,7);const ds=[];
  for(let i=0;i<len;i++){ds.push(i===0?R(2,9):(Math.random()<.3?0:R(2,9)))}
  const names=PNAMES;
  const parts=[];let n=0;
  ds.forEach((d,i)=>{const p=len-1-i;n+=d*10**p;if(d>0)parts.push(`${d} ${names[p]}`)});
  const txt=parts.length>1?parts.slice(0,-1).join(', ')+' ו-'+parts[parts.length-1]:parts[0];
  const zeros=ds.some((d,i)=>d===0);
  return num(`כתבו במספרים: <b>${txt}</b>`,n,
   `כותבים כל ספרה במקומה${zeros?', ובמקום שאין בו כלום כותבים 0':''}: ${eq(fmt(n))}`,{svg:pvTable(len,[ds.map(d=>d>0?d:'')],-1)});
}
function qCompareBig(){
  const len=LV===1?5:R(5,7);let a=[R(1,9)];for(let i=1;i<len;i++)a.push(R(0,9));
  const pos=R(1,len-1);let b=a.slice();let nd;do{nd=R(0,9)}while(nd===a[pos]);b[pos]=nd;
  const A=Number(a.join('')),B=Number(b.join(''));const big=Math.max(A,B),small=Math.min(A,B);
  return mc(`איזה מספר גדול יותר?`,fmt(big),[fmt(small)],
   `משווים ספרה אחר ספרה, מהספרה השמאלית ביותר. ההבדל הראשון הוא ב${PLACE[len-1-pos]}: ${a[pos]} מול ${b[pos]}. לכן ${eq(fmt(big))} גדול יותר.`,{fixed:false,svg:pvTable(len,[a,b],-1)});
}
function lineSvg(A,B,k){
  const x0=50,x1=550,y=78,st=(x1-x0)/10;
  let s=`<svg viewBox="0 0 600 140" class="fig"><line x1="20" y1="${y}" x2="580" y2="${y}" stroke="#334" stroke-width="3"/>`;
  for(let i=0;i<=10;i++){const x=x0+i*st,h=i%5===0?15:9;s+=`<line x1="${x}" y1="${y-h}" x2="${x}" y2="${y+h}" stroke="#334" stroke-width="2.5"/>`}
  s+=`<text x="${x0}" y="${y+40}" text-anchor="middle" font-size="19" font-weight="700">${fmt(A)}</text><text x="${x1}" y="${y+40}" text-anchor="middle" font-size="19" font-weight="700">${fmt(B)}</text>`;
  const x=x0+k*st;
  s+=`<polygon points="${x-10},${y-48} ${x+10},${y-48} ${x},${y-22}" fill="#e8590c"/><text x="${x}" y="${y-56}" text-anchor="middle" font-size="26" font-weight="800" fill="#e8590c" style="fill:#e8590c">?</text></svg>`;
  return s;
}
function qLine(){
  const st=pick(LV===1?[100,1000,10000]:[100,200,500,1000,2000,5000,10000,20000,50000]);const A=R(0,4)*st*10;const B=A+10*st;const k=R(1,9);
  return num(`על ישר המספרים יש 10 חלקים שווים בין שני המספרים המסומנים. איזה מספר מסומן בחץ?`,A+k*st,
   `בין ${eq(fmt(A))} ל-${eq(fmt(B))} יש 10 חלקים שווים.<br>גודל כל חלק: ${eq(`(${fmt(B)} − ${fmt(A)}) ÷ 10 = ${fmt(st)}`)}<br>החץ נמצא אחרי ${k} חלקים: ${eq(`${fmt(A)} + ${k} × ${fmt(st)} = ${fmt(A+k*st)}`)}`,{svg:lineSvg(A,B,k)});
}
function qMiddle(){
  const m=pick(LV===1?[1000,10000]:[1000,2000,5000,10000]);const X=R(1,LV===1?9:30)*m;const gap=R(1,6)*2;const Y=X+gap*m;
  return num(`איזה מספר נמצא בדיוק באמצע בין ${eq(fmt(X))} לבין ${eq(fmt(Y))} ?`,(X+Y)/2,
   `המרחק בין המספרים: ${eq(fmt(Y-X))}. חצי מהמרחק: ${eq(fmt((Y-X)/2))}.<br>${eq(`${fmt(X)} + ${fmt((Y-X)/2)} = ${fmt((X+Y)/2)}`)}`);
}
function seqParams(){
  const step=pick(LV===1?[10,100,500,1000,10000]:[10,50,100,250,500,1000,2000,5000,10000,25000]);const down=Math.random()<(LV===1?.3:.4);
  let base=LV===1?R(1,90)*1000:R(1,300)*1000+(Math.random()<.5?R(0,9)*100:0);if(LV!==1&&step<1000&&Math.random()<.5)base=R(100,9000)*10;
  if(down&&base<8*step)base+=8*step;
  if(LV===1&&!down&&base+6*step>99000)base=R(1,Math.floor((99000-6*step)/1000))*1000; /* החוברת: עד 100,000 */
  if(LV===1&&down&&base>99000)base=R(Math.ceil(6*step/1000),99)*1000;
  const t=Array.from({length:7},(_,i)=>down?base-i*step:base+i*step);
  return {step,down,t};
}
function qSeqNext(){
  const {step,down,t}=seqParams();
  return num(`המשיכו את הסדרה: ${eq(t.slice(0,4).map(fmt).join(' , ')+' , ?')}`,t[4],
   `הדילוג הוא ${eq(fmt(step))} (${down?'הסדרה יורדת':'הסדרה עולה'}).<br>${eq(`${fmt(t[3])} ${down?'−':'+'} ${fmt(step)} = ${fmt(t[4])}`)}`);
}
function qSeqMiss(){
  const {step,down,t}=seqParams();const h=R(1,4);const arr=t.slice(0,6).map((x,i)=>i===h?'?':fmt(x));
  return num(`איזה מספר חסר בסדרה? ${eq(arr.join(' , '))}`,t[h],
   `הדילוג הוא ${eq(fmt(step))}. ${down?'מחסירים':'מוסיפים'} את הדילוג מהמספר שלפני החסר:<br>${eq(`${fmt(t[h-1])} ${down?'−':'+'} ${fmt(step)} = ${fmt(t[h])}`)}`);
}
function qSeqStep(){
  const {step,down,t}=seqParams();
  return num(`בכמה מדלגים בסדרה? ${eq(t.slice(0,5).map(fmt).join(' , ')+' , ...')}`,step,
   `מחסרים בין שני מספרים סמוכים: ${eq(`${fmt(down?t[0]:t[1])} − ${fmt(down?t[1]:t[0])} = ${fmt(step)}`)}`);
}

/* ===== סגנון החוברת (עמ׳ 95-110, 117-121) ===== */
function qExpanded(){
  const len=LV===1?5:R(5,6);const ds=[];
  for(let i=0;i<len;i++)ds.push(i===0?R(1,9):R(0,9));
  const N=Number(ds.join(''));
  if(Math.random()<.6){
    const expr=ds.map((d,i)=>`${d} × ${fmt(10**(len-1-i))}`).join(' + ');
    return num(`איזה מספר מתקבל? ${eq(expr)}`,N,
     `כל ספרה נכנסת למקום שלה (ספרה 0 – מקום ריק): ${eq(fmt(N))}`,{svg:pvTable(len,[ds],-1)});
  }
  const vals=shuffle(ds.map((d,i)=>d*10**(len-1-i)).filter(v=>v>0));
  return num(`איזה מספר מתקבל? ${eq(vals.map(fmt).join(' + '))}`,N,
   `מחברים את הערכים: ${eq(`${vals.map(fmt).join(' + ')} = ${fmt(N)}`)}`);
}
function qPlaceOp(){
  const u=pick([10,100,1000]),k=R(2,9),N=R(10000,LV===1?99999:899999),add=Math.random()<.5;
  const ans=add?N+k*u:N-k*u;
  if(ans<=0||(LV===1&&ans>99999))return qPlaceOp();
  return num(`נתון ש-${eq(`● = ${k}`)}. חשבו: ${eq(`${fmt(N)} ${add?'+':'−'} ● × ${fmt(u)}`)}`,ans,
   `קודם כפל: ${eq(`● × ${fmt(u)} = ${k} × ${fmt(u)} = ${fmt(k*u)}`)}<br>אחר כך ${add?'חיבור':'חיסור'}: ${eq(`${fmt(N)} ${add?'+':'−'} ${fmt(k*u)} = ${fmt(ans)}`)}`);
}
function qNeighbor(){
  const X=pick([R(11,99)*1000,R(100,990)*100,R(1000,9900)*10]);
  if(Math.random()<.5)return num(`מהו המספר שבא <b>לפני</b> ${eq(fmt(X))} ?`,X-1,
   `המספר שלפני הוא קטן ב-1: ${eq(`${fmt(X)} − 1 = ${fmt(X-1)}`)}<br>כשמחסירים 1 ממספר שנגמר באפסים, האפסים הופכים ל-9.`);
  return num(`מהו המספר שבא <b>אחרי</b> ${eq(fmt(X-1))} ?`,X,
   `המספר שאחרי הוא גדול ב-1: ${eq(`${fmt(X-1)} + 1 = ${fmt(X)}`)}<br>כשמוסיפים 1 למספר שנגמר ב-9, מתחלפת ספרה ונוצרים אפסים.`);
}
function qNumGrid(){
  const cols=6,rows=4,s=R(1000,9900)*10+R(0,9),h=R(2,cols*rows-3),total=cols*rows;
  let t='<div style="overflow-x:auto"><table dir="ltr" style="border-collapse:collapse;margin:0 auto">';
  for(let r=0;r<rows;r++){t+='<tr>';for(let c=0;c<cols;c++){const i=r*cols+c;
    t+=`<td style="border:1.5px solid #b8c4e8;padding:5px 7px;font-size:14px;text-align:center;${i===h?'background:#fff3bf;font-weight:800;color:#e8590c':''}">${i===h?'?':fmt(s+i)}</td>`}t+='</tr>'}

  if(Math.random()<.65)return num(`כמה אלכסונים אפשר לשרטט ב${names[n]}? (אלכסון מחבר שני קודקודים שאינם סמוכים)`,n*(n-3)/2,
   n===3?`במשולש כל שני קודקודים סמוכים, לכן אין אלכסונים.`:`מכל קודקוד יוצאים ${n-3} אלכסונים. ${n} קודקודים × ${n-3} = ${n*(n-3)}, ואז מחלקים ב-2 כי כל אלכסון נספר פעמיים: ${n*(n-3)/2}.`,{svg:polySvg(pts)});
  return num(`כמה אלכסונים יוצאים מקודקוד אחד ב${names[n]}?`,n-3,`מקודקוד אחד אפשר לחבר לכל הקודקודים חוץ מעצמו ומשני השכנים שלו: ${eq(`${n} − 3 = ${n-3}`)}`,{svg:polySvg(pts)});
}
function angleSvg(th){
  const rot=pick([0,0,20,45,160,200,300])*Math.PI/180,cx=100,cy=110,L=78,r=24;
  const p1=[cx+L*Math.cos(-rot),cy+L*Math.sin(-rot)],a2=-rot-th*Math.PI/180,p2=[cx+L*Math.cos(a2),cy+L*Math.sin(a2)];
  const q1=[cx+r*Math.cos(-rot),cy+r*Math.sin(-rot)],q2=[cx+r*Math.cos(a2),cy+r*Math.sin(a2)];
  return `<svg viewBox="0 0 200 200" class="fig" style="max-height:210px"><line x1="${cx}" y1="${cy}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="#3b5bdb" stroke-width="4" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#3b5bdb" stroke-width="4" stroke-linecap="round"/><path d="M${q1[0].toFixed(1)},${q1[1].toFixed(1)} A${r},${r} 0 0 0 ${q2[0].toFixed(1)},${q2[1].toFixed(1)}" fill="none" stroke="#e8590c" stroke-width="3"/></svg>`;
}
function qAngle(){
  const k=pick(['חדה','ישרה','קהה']);const th=k==='חדה'?R(25,70):k==='ישרה'?90:R(112,160);
  return mc(`איזו זווית זו?`,`זווית ${k}`,['זווית חדה','זווית ישרה','זווית קהה'],
   `זווית חדה קטנה מ-90 מעלות, זווית ישרה שווה ל-90 מעלות (פינה של ריבוע), וזווית קהה גדולה מ-90 מעלות. זו זווית ${k}.`,{svg:angleSvg(th),fixed:true});
}
function sideSvg(par){
  const pts=par?[[60,45],[190,45],[140,150],[10,150]]:[[30,45],[170,45],[170,150],[30,150]];
  let s=`<svg viewBox="0 0 200 200" class="fig" style="max-height:210px"><polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#dbe9ff" stroke="#3b5bdb" stroke-width="3"/>`;
  const off=[[-14,-8],[14,-8],[14,22],[-14,22]];
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#1c3faa"/><text x="${p[0]+off[i][0]}" y="${p[1]+off[i][1]}" text-anchor="middle" font-size="19" font-weight="800">${HL[i]}</text>`});
  return s+`</svg>`;
}
function qSides(){
  const par=Math.random()<.5,shape=par?'המקבילית':'המלבן';const sides=['אב','בג','גד','דא'];const i=R(0,3);const S=sides[i];
  const opp=sides[(i+2)%4],adj1=sides[(i+1)%4],adj2=sides[(i+3)%4];const diag=['אג','בד'];
  const t=R(0,2);
  if(t===0)return mc(`ב${shape} אבגד – איזו צלע <b>נגדית</b> לצלע <span class="sd">${S}</span> ?`,`<span class="sd">${opp}</span>`,[adj1,adj2,diag[0]].map(x=>`<span class="sd">${x}</span>`),
    `צלע נגדית היא הצלע שנמצאת מול הצלע הנתונה, ולא נוגעת בה. מול ${S} נמצאת ${opp}.`,{svg:sideSvg(par)});
  if(t===1)return mc(`ב${shape} אבגד – איזו צלע <b>מקבילה</b> לצלע <span class="sd">${S}</span> ?`,`<span class="sd">${opp}</span>`,[adj1,adj2,diag[1]].map(x=>`<span class="sd">${x}</span>`),
    `בצורה הזו הצלעות הנגדיות מקבילות זו לזו. הצלע המקבילה ל-${S} היא ${opp}.`,{svg:sideSvg(par)});
  const adj=pick([adj1,adj2]);
  return mc(`ב${shape} אבגד – איזו צלע <b>סמוכה</b> לצלע <span class="sd">${S}</span> ?`,`<span class="sd">${adj}</span>`,[opp,diag[0],diag[1]].map(x=>`<span class="sd">${x}</span>`),
    `צלעות סמוכות נפגשות באותו קודקוד. הצלע ${adj} נפגשת עם ${S} בקודקוד משותף. (${opp} היא צלע נגדית, ו-${diag[0]} ו-${diag[1]} הם אלכסונים ולא צלעות.)`,{svg:sideSvg(par)});
}
function qDiagName(){
  const par=Math.random()<.5;const sides=['אב','בג','גד','דא'];const d=pick(['אג','בד']);
  return mc(`איזה מהקטעים הוא <b>אלכסון</b> במרובע אבגד?`,`<span class="sd">${d}</span>`,sides.map(x=>`<span class="sd">${x}</span>`).slice(0,3),
   `אלכסון מחבר שני קודקודים שאינם סמוכים. ${d} מחבר בין שני קודקודים מנוגדים. האחרים הם צלעות.`,{svg:sideSvg(par)});
}

/* ===================== מבנה הנושאים ===================== */
const TOPICS=[
 {id:'dec',title:'מבנה עשרוני',emoji:'🔢',color:'#7048e8',subs:[
  {id:'place',title:'ערך הספרה',pages:'עמ׳ 95-98, 101-104',gens:[qDigitValue,qAddUnits,qWriteNumber,qCompareBig,qExpanded,qPlaceOp]},
  {id:'line',title:'ישר המספרים',pages:'עמ׳ 117-121',gens:[qLine,qLine,qMiddle,qLineSeg]},
  {id:'seq',title:'סדרות ודילוגים שווים',pages:'עמ׳ 106-110, 135-137',gens:[qSeqNext,qSeqMiss,qSeqStep,qNeighbor,qNumGrid]}]},
 {id:'ar',title:'פעולות חשבון',emoji:'➕',color:'#f76707',subs:[
  {id:'addsub',title:'חיבור וחיסור (כולל מציאת נעלם)',pages:'עמ׳ 131-134, 142-145',gens:[qAdd,qSub,qUnknown,qUnknown]},
  {id:'muldiv',title:'כפל, חילוק וסדר פעולות',pages:'עמ׳ 116',gens:[qMul,qDiv,qOrder,qOrder]},
  {id:'words',title:'בעיות מילוליות רב-שלביות',pages:'עמ׳ 114-115, 140-141',gens:[qWord]}]},
 {id:'fr',title:'שברים',emoji:'🍕',color:'#2b9348',subs:[
  {id:'frid',title:'זיהוי השבר',pages:'עמ׳ 9-11, 13-15, 23-26, 47',gens:[qFracShape,qFracShape,qFracTerms,qFracOfQty,qFracKind,qWholeFrac]},
  {id:'frconv',title:'שבר מדומה ומספר מעורב',pages:'עמ׳ 30-35, 48-52',gens:[qToMixed,qToImproper,qImproperWhole,qFracKind]},
  {id:'frcmp',title:'השוואת שברים',pages:'עמ׳ 44-45, 54-56, 27-28',gens:[qCmpSame,qCmpSame,qCmpOne,qCmpMixed,qOrder3]}]},
 {id:'geo',title:'גיאומטריה',emoji:'📐',color:'#1c7ed6',subs:[
  {id:'area',title:'שטח והיקף',pages:'חוברת גיאומטריה עמ׳ 72-83, 96-101',gens:[qRectAreaPer,qRectAreaPer,qSquare,qMissingSide,qCmpAreas,qGrid,qGarden]},
  {id:'shapes',title:'זוויות, אלכסונים וצלעות',pages:'חוברת גיאומטריה עמ׳ 30-36, 38-42, 54, 56-61',gens:[qAngle,qDiagonals,qSides,qDiagName,qShapeProp,qShapeProp]}]}
];
const ALLSUBS=TOPICS.flatMap(t=>t.subs);
const GENS={qExpanded,qPlaceOp,qNeighbor,qNumGrid,qLineSeg,qDigitValue,qAddUnits,qWriteNumber,qCompareBig,qLine,qMiddle,qSeqNext,qSeqMiss,qSeqStep,qAdd,qSub,qUnknown,qMul,qDiv,qOrder,qWord,qFracShape,qFracTerms,qFracOfQty,qFracKind,qWholeFrac,qToMixed,qToImproper,qImproperWhole,qCmpSame,qCmpOne,qCmpMixed,qOrder3,qRectAreaPer,qSquare,qMissingSide,qCmpAreas,qGrid,qGarden,qShapeProp,qDiagonals,qAngle,qSides,qDiagName};

/* ===================== ממשק ===================== */
if(typeof document!=='undefined'){
const app=document.getElementById('app');
let BEST={};const KEY='mivdak-d4-v1';
try{BEST=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){BEST={}}
function saveBest(id,p){try{if(!(BEST[id]>=p)){BEST[id]=p;localStorage.setItem(KEY,JSON.stringify(BEST))}}catch(e){}}
try{LV=Number(localStorage.getItem(KEY+'-lv'))===2?2:1}catch(e){}
let S=null;

function daysLeft(){const t=new Date(2026,11,2),n=new Date();const a=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-a)/86400000)}
function home(){
  const d=daysLeft();
  const cnt=d>1?`נשארו ${d} ימים למבדק`:d===1?'המבדק מחר! בהצלחה':d===0?'המבדק היום! בהצלחה, אתם מוכנים':'';
  app.innerHTML=`<div class="hero"><h1>תרגול למבדק אמצע כיתה ד׳</h1><p>שאלות חדשות בכל פעם, לפי כל נושאי המבדק. בוחרים נושא ומתחילים!</p>${cnt?`<span class="count">📅 ${cnt} (יום רביעי, 2.12)</span>`:''}</div>
  <div class="lvl"><b>רמת קושי:</b> <button class="btn ${LV===1?'':'alt'}" data-lv="1">🙂 קל (מתחילים כאן)</button> <button class="btn ${LV===2?'':'alt'}" data-lv="2">💪 רגיל – אתגר</button></div>
  <div class="mix"><div><h2 style="margin:0">⭐ מבדק דמה</h2><div>22 שאלות מכל הנושאים, כמו במבדק האמיתי</div></div><button class="btn big" data-mock="1">בואו נתחיל</button></div>
  <div class="tip">💡 מומלץ להתחיל ממה שנראה קשה. אחרי כל שאלה מקבלים הסבר, גם כשצדקתם.</div>
  ${TOPICS.map(t=>`<section class="topic" style="--tc:${t.color}"><header><h2>${t.emoji} ${t.title}</h2><button class="btn alt" data-topic="${t.id}">תרגול מעורב בנושא</button></header>
   <div class="subs">${t.subs.map(s=>`<button class="subbtn" data-sub="${s.id}"><b>${s.title}</b><small>${s.pages}</small><span class="best">${BEST[s.id+(LV===2?'_h':'')]!=null?'⭐ שיא: '+BEST[s.id+(LV===2?'_h':'')]+'%':''}</span></button>`).join('')}</div></section>`).join('')}`;
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{LV=Number(b.dataset.lv);try{localStorage.setItem(KEY+'-lv',LV)}catch(e){}home()});
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const s=ALLSUBS.find(x=>x.id===b.dataset.sub);start(s.title,s.gens,10,s.id)});
  app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{const t=TOPICS.find(x=>x.id===b.dataset.topic);start(t.title+' – תרגול מעורב',t.subs.flatMap(s=>s.gens),10,'t_'+t.id)});
  app.querySelector('[data-mock]').onclick=()=>{
    const fs=shuffle(ALLSUBS.flatMap(s=>[pick(s.gens),pick(s.gens)]));start('מבדק דמה',fs,fs.length,'mock',true)};
  window.scrollTo(0,0);
}
function build(gens,n,exact){
  const qs=[];const seen=new Set();const order=exact?gens:[];
  if(!exact){let pool=[];while(pool.length<n)pool=pool.concat(shuffle(gens));pool.slice(0,n).forEach(f=>order.push(f))}
  order.forEach(f=>{let q,tries=0;do{q=f();tries++}while(seen.has(q.q+q.svg)&&tries<8);seen.add(q.q+q.svg);qs.push(q)});
  return qs;
}
function start(title,gens,n,id,exact){S={title,gens,id,qs:build(gens,n,exact),i:0,score:0,wrong:[],done:false,exact:!!exact};show()}
function show(){
  const q=S.qs[S.i],n=S.qs.length;S.done=false;
  app.innerHTML=`<div class="top"><button class="back" id="exit">→ חזרה לתפריט</button><div class="prog"><i style="width:${S.i/n*100}%"></i></div><span><b>${S.i+1}</b> מתוך ${n}</span></div>
  <div class="card"><div style="color:var(--muted);font-weight:700;margin-bottom:4px">${S.title}</div>${q.svg?`<div class="figwrap">${q.svg}</div>`:''}<div class="qtext">${q.q}</div>
  <div id="ans">${q.type==='num'?`<div class="numrow"><input id="in" type="text" inputmode="numeric" autocomplete="off" aria-label="התשובה שלכם" placeholder="התשובה"><span class="unit">${q.unit}</span><button class="btn" id="chk">בדיקה</button></div>`
   :`<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.h}</button>`).join('')}</div>`}</div><div id="fb"></div></div>`;
  document.getElementById('exit').onclick=home;
  if(q.type==='num'){const inp=document.getElementById('in');inp.focus({preventScroll:true});
    const go=()=>{const raw=inp.value.replace(/[,\s]/g,'');if(raw===''||isNaN(Number(raw))){inp.focus();return}answer(Number(raw)===q.answer,String(Number(raw)))};
    document.getElementById('chk').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'&&!S.done){e.preventDefault();go()}}}
  else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);answer(q.options[i].ok,i)});
  window.scrollTo(0,0);
}
function answer(ok,val){
  if(S.done)return;S.done=true;const q=S.qs[S.i];
  if(ok)S.score++;else S.wrong.push(q);
  let corr;
  if(q.type==='num'){const inp=document.getElementById('in');inp.disabled=true;inp.classList.add(ok?'right':'wrong');document.getElementById('chk').disabled=true;corr=`<span class="eq">${fmt(q.answer)}</span> ${q.unit}`}
  else{document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.options[i].ok)b.classList.add('right');else if(i===val)b.classList.add('wrong')});corr=q.options.find(o=>o.ok).h}
  const last=S.i===S.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?pick(['כל הכבוד! 🎉','נכון מאוד! ⭐','מעולה! 💪','יפה מאוד! 👏']):'כמעט! 🙂 התשובה הנכונה: '+corr}</h3><div class="why">${q.explain}</div></div><div class="nextrow"><button class="btn big" id="nx">${last?'לסיום':'השאלה הבאה ←'}</button></div>`;
  const nx=document.getElementById('nx');nx.focus({preventScroll:true});nx.onclick=next;
  nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){if(S.i<S.qs.length-1){S.i++;show()}else finish()}
function finish(){
  const n=S.qs.length,p=Math.round(S.score/n*100);const stars=p>=90?3:p>=70?2:p>=50?1:0;
  if(S.id&&!S.retry)saveBest(S.id+(LV===2?'_h':''),p);
  const msg=p>=90?'מדהים! אתם מוכנים למבדק 🌟':p>=70?'עבודה טובה! עוד קצת תרגול והכול יושב':p>=50?'התחלה טובה. כדאי לחזור על ההסברים ולנסות שוב':'לא נורא, כל תרגול מקדם. נסו שוב אחרי שתקראו את ההסברים';
  app.innerHTML=`<div class="card result"><h1>סיימתם!</h1><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="score">${S.score} מתוך ${n}</div><p>${msg}</p>
  <div class="actions">${S.wrong.length?`<button class="btn big" id="rw">לתרגל שוב את הטעויות (${S.wrong.length})</button>`:''}<button class="btn big alt" id="again">סבב חדש</button><button class="btn big alt" id="hm">לתפריט</button></div>
  ${S.wrong.length?`<div class="wronglist"><h2>שאלות שכדאי לחזור עליהן</h2>${S.wrong.map(q=>`<div class="w">${q.svg?`<div class="figwrap" style="transform:scale(.8);margin:-10px 0">${q.svg}</div>`:''}<div>${q.q}</div><div style="color:var(--muted);margin-top:4px">${q.explain}</div></div>`).join('')}</div>`:''}</div>`;
  const rw=document.getElementById('rw');if(rw)rw.onclick=()=>{const w=S.wrong;S={...S,qs:w,i:0,score:0,wrong:[],retry:true};show()};
  document.getElementById('again').onclick=()=>{const f=S.exact?shuffle(ALLSUBS.flatMap(s=>[pick(s.gens),pick(s.gens)])):S.gens;start(S.title,f,S.exact?f.length:10,S.id,S.exact)};
  document.getElementById('hm').onclick=home;window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S&&S.done){const nx=document.getElementById('nx');if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}});
home();
}
</script>
